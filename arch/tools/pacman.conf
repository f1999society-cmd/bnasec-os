#
# BNAsec-Arch build pacman.conf — paths are ROOT-RELATIVE (relocated by -r).
# HookDir deliberately points at an empty dir: pacman hook scripts would run
# on the HOST filesystem (no chroot), so they must never fire during build.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
# NOTE: DBPath/CacheDir/GPGDir/HookDir are passed per-invocation on the
# command line (pacman 7.1 does not root-relocate config paths), and the
# HookDir is always an empty dir: hook scripts would run on the HOST
# filesystem (no chroot), so they must never fire during build.

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
